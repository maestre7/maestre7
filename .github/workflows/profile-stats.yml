name: Update profile statistics

on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions: {}

jobs:
  update:
    name: Generate profile statistics
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out the repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Generate SVG cards
        uses: vn7n24fzkq/github-profile-summary-cards@d9632798b299e9ad6940449a859c30742eb5b549 # v0.12.0
        env:
          # The repository-scoped token can read public profile data and write only here.
          GITHUB_TOKEN: ${{ github.token }}
        with:
          USERNAME: ${{ github.repository_owner }}
          AUTO_PUSH: false

      - name: Retain the cards used by the profile README
        shell: bash
        run: |
          set -euo pipefail
          find profile-summary-card-output -type f ! \( \
            -path 'profile-summary-card-output/github/3-stats.svg' -o \
            -path 'profile-summary-card-output/github/1-repos-per-language.svg' -o \
            -path 'profile-summary-card-output/github_dark/3-stats.svg' -o \
            -path 'profile-summary-card-output/github_dark/1-repos-per-language.svg' \
          \) -delete
          find profile-summary-card-output -type d -empty -delete
          for card in \
            profile-summary-card-output/github/3-stats.svg \
            profile-summary-card-output/github/1-repos-per-language.svg \
            profile-summary-card-output/github_dark/3-stats.svg \
            profile-summary-card-output/github_dark/1-repos-per-language.svg; do
            test -s "$card"
            grep -q '<svg' "$card"
          done

      - name: Commit updated cards when needed
        shell: bash
        run: |
          set -euo pipefail
          git add profile-summary-card-output
          if git diff --cached --quiet; then
            echo 'Profile statistics are already current.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'chore: update profile statistics'
          git push
